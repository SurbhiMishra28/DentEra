<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DentEra — Offline</title>
  <link rel="icon" href="/pwa-192.png" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
      font-family: Manrope, system-ui, sans-serif; color: #142f43;
      background: linear-gradient(145deg, #f5fbff, #e5f8fc); padding: 2rem; }
    .mark { width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center;
      background: linear-gradient(145deg, #149cb1, #116b82); box-shadow: 0 12px 30px rgba(15,124,146,.3); margin: 0 auto 1.2rem; }
    .mark svg { width: 44px; height: 44px; }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
    p { margin: 0 0 1.4rem; color: #526d7d; line-height: 1.6; }
    button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: .8rem 1.6rem;
      font-weight: 800; color: #fff; background: linear-gradient(135deg, #1699ad, #116b82); }
  </style>
</head>
<body>
  <div>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" style="color:#fff">
        <path d="M9.2 5.5c2.2 0 3.1 1.1 6.8 1.1s4.6-1.1 6.8-1.1c2.8 0 4.8 2.3 4.8 5.3 0 3.5-1.8 7.1-3.2 10.3-1.4 3.2-2.1 5.4-3.6 5.4-1.6 0-1.6-6.9-4.8-6.9s-3.2 6.9-4.8 6.9c-1.5 0-2.2-2.2-3.6-5.4C6.2 17.9 4.4 14.3 4.4 10.8c0-3 2-5.3 4.8-5.3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M12 11.1h8M16 7.4v7.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>DentEra needs a connection to load your clinic data.<br />Check your internet and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
